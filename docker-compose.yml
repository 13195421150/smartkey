services:
  cdk:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      SERVER_MODE: release
      DB_PATH: /app/data/cdk_recharge.db
      WEB_DIR: /app/web
      INSTALL_MODE: wizard
      UPDATE_ENABLED: ${UPDATE_ENABLED:-0}
      JWT_SECRET: ${JWT_SECRET:?Run scripts/init-env.sh first}
      TRUSTED_PROXIES: 172.16.0.0/12
    volumes:
      - cdk_data:/app/data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      CDK_DOMAIN: ${CDK_DOMAIN:?Set your own domain in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      cdk:
        condition: service_healthy

volumes:
  cdk_data:
  caddy_data:
  caddy_config:
